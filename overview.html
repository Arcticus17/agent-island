<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent 会话总览</title>
  <link rel="stylesheet" href="/src/overview.css" />
</head>
<body>
  <header>
    <h1>会话总览</h1>
    <div id="header-right">
      <span id="summary"></span>
      <span id="updated"></span>
      <button id="btn-stats" title="统计报表">统计</button>
      <button id="btn-remote" title="远程查看地址">远程</button>
      <span id="remote-url" class="hidden"></span>
    </div>
  </header>
  <main>
    <section id="stats-view" class="hidden">
      <div id="stats-controls">
        <button id="btn-stats-days" title="切换统计周期">最近 7 天</button>
      </div>
      <div id="stats-table"></div>
    </section>
    <div id="session-list"></div>
    <section id="detail" class="hidden">
      <div id="detail-header"></div>
      <div id="detail-actions">
        <button id="btn-term" title="打开终端">打开终端</button>
        <button id="btn-restart" title="恢复会话">恢复</button>
        <button id="btn-stop" title="停止会话">停止</button>
      </div>
      <div id="send-bar">
        <input id="prompt-input" type="text" placeholder="给这个会话发消息..." />
        <button id="btn-send" title="发送消息" disabled>发送</button>
      </div>
      <div id="chat-log"></div>
      <button id="scroll-bottom" title="回到底部" class="hidden">↓</button>
    </section>
  </main>
  <script type="module" src="/src/overview.js"></script>
</body>
</html>
