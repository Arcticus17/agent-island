name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Install pinned test browser
        run: npx playwright install chromium

      - name: Type and Svelte checks
        run: npm run check

      # Same split as release.yml: the regression chain blocks, the visual
      # comparison reports. The stored screenshots are bound to the
      # development machine's fonts (see
      # docs/verification/2026-09-30-visual-baseline-refresh.md), so every
      # case would fail on this runner image even without a regression.
      - name: Regression without visual comparison
        run: npm run test:frontend && npm run test:unit && npm run test:browser && cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Visual comparison (reported, not enforced)
        continue-on-error: true
        run: npm run test:visual

      - name: Upload visual diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-ci
          path: tests/visual/artifacts
          if-no-files-found: ignore
