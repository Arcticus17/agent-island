name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Install pinned test browser
        run: npx playwright install chromium

      - name: Type and Svelte checks
        run: npm run check

      # Kept as an explicit chain instead of `npm test` so the visual comparison
      # below can run without blocking the release.
      - name: Regression without visual comparison
        run: npm run test:frontend && npm run test:unit && npm run test:browser && cargo test --manifest-path src-tauri/Cargo.toml --lib

      # The stored screenshots are bound to the development environment (Windows 11
      # with the lockfile's Chromium). This runner is windows-2025-vs2026 and
      # differs by 1-9% of pixels on every one of the 14 cases, including a 1%
      # difference on the collapsed capsule, which is font rendering rather than a
      # layout change. The comparison is therefore reported, not enforced: the
      # release-blocking comparison runs on the development machine, as recorded in
      # docs/verification/2026-09-30-visual-baseline-refresh.md. To make CI block on
      # it, the references must be regenerated on this runner image.
      - name: Visual comparison (reported, not enforced)
        id: visual
        continue-on-error: true
        run: npm run test:visual

      # A report-only gate that nobody reads drifts silently. Surface the outcome
      # as a run annotation and a step summary line so a red visual comparison is
      # impossible to miss even though it does not block the release.
      - name: Record visual outcome
        if: always()
        env:
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
        run: |
          $outcome = $env:VISUAL_OUTCOME
          if ($outcome -eq "failure") {
            Write-Output "::warning title=Visual comparison failed::npm run test:visual reported differences (report-only on this runner). Review the visual-diffs artifact before publishing; see docs/verification/public-release-compatibility.md."
            $line = "FAILED — 发布前必须人工复核 visual-diffs 附件：确认仅为已知字体渲染差异，无新增布局回归。"
          } elseif ($outcome -eq "success") {
            $line = "PASSED — 与开发机基线一致。"
          } else {
            $line = "SKIPPED — 上游步骤未执行（outcome: $outcome）。"
          }
          "### Visual comparison" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          $line | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload visual diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: tests/visual/artifacts
          if-no-files-found: ignore

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 私钥不进仓库：仓库 Settings → Secrets 里配置（内容是 ~/.tauri/agent-island.key 全文）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Agent Island ${{ github.ref_name }}"
          releaseBody: |
            ## Agent Island ${{ github.ref_name }}

            自动构建发布：Windows EXE 安装器 + MSI，以及签名后的自动更新清单 latest.json。

            客户端「检查更新」会读取 `releases/latest/download/latest.json`，校验签名后静默下载安装。
            按《公开发布适配门槛》，本安装包在完成干净环境、混合 DPI、多显示器与安装/卸载验收前属测试版；未实测的系统与架构不列为已支持。详见 docs/verification/public-release-compatibility.md。
          releaseDraft: false
          prerelease: false
          # 生成 latest.json（各平台安装包 URL + 签名），自动更新就靠它
          includeUpdaterJson: true
