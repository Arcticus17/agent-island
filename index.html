<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Island</title>
  <link rel="stylesheet" href="/src/style.css?v=17" />
</head>
<body>
  <div id="island">
    <div id="compact">
      <div id="icon-stack">
        <img id="compact-icon" class="agent-icon" alt="" style="display:none" />
        <span id="stack-count" class="hidden"></span>
      </div>
      <span id="status-dot" class="dot gray"></span>
      <span id="agent-name">加载中...</span>
      <span id="nav-arrow" title="下一个 Agent" aria-label="下一个 Agent" style="display:none">▶</span>
      <span id="page-indicator" style="display:none"></span>
    </div>
    <div id="expanded">
      <div id="expanded-header">
        <img id="expanded-icon" class="agent-icon" alt="" />
        <span id="expanded-name"></span>
        <span id="privacy-badge" class="hidden">隐私遮罩</span>
        <div class="header-actions">
          <button id="btn-privacy" title="隐私遮罩">隐私</button>
          <button id="btn-focus" title="专注模式">专注:关</button>
          <button id="btn-fields" title="显示字段">字段</button>
          <button id="btn-theme" title="外观设置">外观</button>
        </div>
      </div>
      <div id="fields-pop" class="hidden">
        <label><input type="checkbox" data-field-check="status"> 状态</label>
        <label><input type="checkbox" data-field-check="cpu"> CPU</label>
        <label><input type="checkbox" data-field-check="mem"> 内存</label>
        <label><input type="checkbox" data-field-check="pid"> PID / 进程</label>
        <label><input type="checkbox" data-field-check="uptime"> 本次运行</label>
        <label><input type="checkbox" data-field-check="last-active"> 最后活动</label>
        <label><input type="checkbox" data-field-check="stats"> 统计</label>
        <label><input type="checkbox" data-field-check="cwd"> 目录</label>
        <label><input type="checkbox" data-field-check="file"> 当前文件</label>
        <label><input type="checkbox" data-field-check="output"> 最近输出</label>
      </div>
      <div id="quick-menu" class="hidden">
        <button data-action="overview">打开总览</button>
        <button data-action="privacy">隐私遮罩</button>
        <button data-action="focus">专注模式</button>
        <button data-action="quiet">勿扰开关</button>
      </div>
      <div id="focus-pop" class="hidden">
        <div class="focus-mode-row">
          <button data-focus="off">关闭</button>
          <button data-focus="errors">仅报错</button>
          <button data-focus="quiet">静音</button>
          <button data-focus="pinned">固定</button>
        </div>
        <label class="focus-toggle"><input id="quiet-auto-input" type="checkbox" /> 自动勿扰</label>
        <div class="focus-times">
          <label>开始 <input id="quiet-start-input" type="time" /></label>
          <label>结束 <input id="quiet-end-input" type="time" /></label>
        </div>
      </div>
      <div id="theme-pop" class="hidden">
        <label class="theme-row">透明度 <input type="range" data-theme="opacity" min="50" max="100" value="92" /></label>
        <label class="theme-row">圆角 <input type="range" data-theme="radius" min="12" max="30" value="26" /></label>
        <label class="theme-row">宽度 <input type="range" data-theme="width" min="360" max="520" step="10" value="420" /></label>
        <label class="theme-row"><input type="checkbox" data-theme="snap" /> 位置吸附</label>
        <label class="theme-row"><input type="checkbox" data-theme="taskbar" /> 任务栏显示</label>
      </div>
      <div id="agent-strip"></div>
      <div id="card-preview" class="hidden"></div>
      <div id="notify-stack"></div>
      <div class="divider"></div>
      <div id="expanded-body">
        <div class="section-label" data-section="run">运行状态</div>
        <div class="section-grid">
          <div class="info-row" data-field="status"><span class="label">状态</span><span id="exp-status"></span></div>
          <div class="info-row" data-field="cpu"><span class="label">CPU</span><span id="exp-cpu"></span></div>
          <div class="info-row" data-field="mem"><span class="label">内存</span><span id="exp-mem"></span></div>
          <div class="info-row" data-field="pid"><span class="label">PID / 进程</span><span id="exp-pid"></span></div>
          <div class="info-row" data-field="uptime"><span class="label">本次运行</span><span id="exp-uptime"></span></div>
          <div class="info-row" data-field="last-active"><span class="label">最后活动</span><span id="exp-last-active"></span></div>
          <div class="info-row wide" data-field="stats"><span class="label">统计</span><span id="exp-stats"></span></div>
        </div>
        <div class="section-label" data-section="session">会话信息</div>
        <div class="info-row wide" data-field="cwd"><span class="label">目录</span><span id="exp-cwd" class="path-link"></span></div>
        <div class="section-label" data-section="output">最近输出 <span id="live-badge" class="live-badge hidden">● 实时</span></div>
        <div class="info-row wide" data-field="file"><span class="label">当前文件</span><span id="exp-file" class="path-link"></span></div>
        <div id="exp-output" class="log-panel" data-field="output"></div>
      </div>
      <div class="divider"></div>
      <div id="expanded-footer">
        <div class="nav-group">
          <button id="btn-prev" title="上一个会话" aria-label="上一个会话" disabled>◀</button>
          <span id="exp-page"></span>
          <button id="btn-next" title="下一个会话" aria-label="下一个会话" disabled>▶</button>
        </div>
        <div class="action-group">
          <button id="btn-overview" title="打开会话总览">总览</button>
          <button id="btn-dir" title="打开项目目录" disabled>打开目录</button>
          <button id="btn-term" title="打开终端" disabled>打开终端</button>
          <button id="btn-stop" title="停止 Agent" disabled>停止</button>
          <button id="btn-restart" title="重启 Agent" disabled>重启</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js?v=17"></script>
</body>
</html>
